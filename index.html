.simple-ballot{max-width:790px;margin:0 auto 24px}.candidate-name-list{border:0;padding:0;margin:30px 0}.candidate-name-row{display:flex;align-items:center;gap:18px;margin:22px 0;cursor:pointer}.candidate-name-row input{width:21px;height:21px;accent-color:var(--accent);flex-shrink:0}.candidate-name-row>span{display:flex;align-items:center;gap:20px;flex:1;border:1px solid #b8cbdc;border-radius:4px;padding:17px 22px;min-height:58px;background:#fff}.candidate-name-row small{color:var(--muted);font-size:12px}.candidate-name-row strong{font-size:17px}.candidate-name-row:has(input:checked)>span{background:var(--tint);border-color:var(--accent)}
.candidate-intro-layout{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}.candidate-preview-panel{position:sticky;top:24px}.intro-profile{border:1px solid #cbddec;background:white;padding:30px;min-height:430px}.intro-profile-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}.intro-profile-top h2{font-weight:bold;font-size:28px;overflow-wrap:anywhere;margin:0}.intro-picture{width:90px;height:90px;flex-shrink:0;border-radius:50%;object-fit:cover;border:1px solid #cbddec}.intro-placeholder{background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent)}.intro-personal{margin:27px 0;font-size:17px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.intro-statement{font-size:15px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.intro-slogan{font-size:20px;font-weight:bold;color:var(--accent);margin-top:27px;overflow-wrap:anywhere}.intro-contacts{border-top:1px solid var(--line);margin-top:25px;padding-top:16px}.intro-contacts:empty{display:none}.intro-contacts p{display:flex;gap:15px;font-size:13px;overflow-wrap:anywhere}.social-fields{border:1px solid var(--line);padding:18px}.social-fields legend{font-weight:bold;font-size:14px;padding:0 6px}.social-choice{display:grid;grid-template-columns:115px 1fr;gap:12px;align-items:center;margin:10px 0}.social-choice .check input{width:17px;height:17px;min-height:0;margin:0}.social-choice .check{align-items:center;font-weight:normal}.field input[type=file]{font-size:13px}.candidate-intro-layout .panel{padding:24px}
@media(max-width:900px){.candidate-intro-layout{grid-template-columns:1fr}.candidate-preview-panel{position:static}.intro-profile{min-height:350px}}@media(max-width:620px){.candidate-name-row{gap:12px}.candidate-name-row>span{padding:15px;gap:14px}.social-choice{grid-template-columns:1fr}.intro-profile{padding:22px}.intro-profile-top h2{font-size:24px}.intro-picture{width:70px;height:70px}}

.vote-profile-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.entry-admin-demo{width:100%;margin-top:13px}.round-switch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.round-switch a{border:1px solid #cbddec;background:white;padding:10px 16px;border-radius:3px;font-size:13px;min-height:44px}.round-switch a.selected{background:var(--accent);color:white;border-color:var(--accent);font-weight:bold}.round-name-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border:1px solid var(--line);padding:22px}.round-name-overview>div{padding:15px;border-bottom:1px solid var(--line);font-size:15px}.round-name-overview span{font-size:12px;color:var(--muted);margin-right:15px}.many-candidates{max-height:530px;overflow-y:auto;padding:0 8px 0 0;scrollbar-gutter:stable}.many-candidates .candidate-name-row{margin:14px 0}.election-list{min-width:860px}.election-list td{padding:20px 15px;font-weight:normal}.election-list td:first-child{font-weight:bold;width:30%}.election-list th{padding:15px;font-size:12px}.election-list td:last-child a{display:inline-block;min-height:40px;padding-top:8px}.election-list .badge{white-space:nowrap}.entry-mode{border:1px solid #cbddec;padding:20px}.entry-mode legend{font-size:16px;font-weight:bold;padding:0 7px}.entry-option{display:flex;align-items:flex-start;gap:14px;padding:13px 0;cursor:pointer}.entry-option input{width:18px;height:18px;min-height:18px;flex-shrink:0;accent-color:var(--accent);margin-top:4px}.entry-option strong{display:block}.entry-option small{display:block;margin-top:4px;font-weight:normal}.election-list-links{margin-top:0;margin-bottom:25px}.nav a{padding-left:11px;padding-right:11px;font-size:13px}.vote-profile-description h2{font-size:18px}
@media(max-width:1000px){.vote-profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.round-name-overview{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.vote-profile-grid,.round-name-overview{grid-template-columns:1fr}.round-switch a{flex:1;text-align:center}.many-candidates{max-height:440px}.nav a{font-size:14px;padding:12px 18px}}
[hidden]{display:none!important}.candidate-portrait{object-fit:cover}
</style>
